git:
  sshUsername: git
  useSSHAgent: false


forkURLs:
  kubeaid:
    url: https://github.com/Obmondo/KubeAid.git
    version: 32.1.0
  kubeaidConfig:
    url: git@github.com:nihaldivyam/kubeaid-config.git
    directory:

cluster:
  type: workload
  name: test-az1
  k8sVersion: v1.35.7
  enableAuditLogging: false
  apiServer:
    extraArgs: {}
    extraVolumes: []
    files: []
  argoCD:
    deployKeys:
      kubeaidConfig:
        privateKeyFilePath: ~/.ssh/id_rsa

kubePrometheus:
  version: v0.18.0

cloud:
  azure:
    tenantID: 7c6459a6-ad9d-4c5c-ba18-e2a3979385a0
    subscriptionID: bd59662e-a78e-4d7c-84f6-9d9ad1883726
    location: NorthEurope
    aks: true
    # The first node-group becomes the AKS System agent pool; AKS's built-in
    # cluster autoscaler scales each pool between minSize and maxSize.
    nodeGroups:
      - name: default
        minSize: 3
        maxSize: 6
        cpu: 4
        memory: 8
        vmSize: Standard_F4s_v2
        diskSizeGB: 128


